# Pogema random 地图族（when-to-switch registry：random-* 训练集）
# Reptile 任务=族；专家数据生成与训练只取 random-* 的 train split（8:2）。
map_type: random
map_name: "random-"    # 只取 when-to-switch random-* 族（envs/map_registry.py 内 8:2 划 train/test）
map_size: 64           # 仅作元数据/回退用；地图实际尺寸由 registry 地图串决定
num_agents: 8          # 开发默认；目标 96（见设计文档 §0）；命令行 --num-agents 覆盖
obs_radius: 5          # ⟹ patch 边长 K = 11
max_episode_steps: 512 # 设计文档 §0 目标值；开发阶段可在命令行降为 256
obstacle_density: 0.3  # 随机地图障碍密度，传给 GridConfig density 参数

# Pogema 环境参数
collision_system: soft        # soft: 允许碰撞但给惩罚
on_target: finish             # 到达目标即停（标准 MAPF；与 LaCAM 固定目标路径对齐）
# observation_type 不设（Pogema 2.x 默认返回 (3,K,K) 局部观测数组）

# 奖励参数（RewardBuilder.from_config 读取）
# lambda_f=1.0: PBRS 主信号比例（原 0.1 太弱，shaping 淹没在负惩罚里）
# shaping_clip=5.0: 截断多体绕路和 goal-restart 引起的极端 shaping（原最大-9.1→现-5）
# wait_cost 已移除：等待是拥挤 MAPF 的合理策略，不应额外惩罚
reward:
  lambda_f:       1.5
  shaping_clip:   5.0
  goal_reward:    3.5
  step_cost:      0.005
  collision_cost: 0.3
  normalize_shaping: true
  gamma:          0.99
  # 持续无进展（死锁）惩罚：连续 stuck_patience 步未刷新历史最近 d_BFS 即每步罚 stuck_cost。
  # 治岔路口死锁（等待近免费 + PBRS 残差(1−γ)d 还正奖励卡住 → 死锁价值最优）。
  # 0.05 > 归一 PBRS 残差 ~0.015 → 卡住净负；只罚持续无进展、不罚战术性短等(patience=5)。
  stuck_cost:     0.05
  stuck_patience: 5
