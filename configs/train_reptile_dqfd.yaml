# 阶段二训练配置：DQfD + Reptile 元预训练
# 对应设计文档 §3.3–3.4

meta_iterations: 20000
inner_steps: 5
inner_lr: 0.0003
# outer update 学习率：线性衰减。注意：刻意偏离设计文档 §key-params 的 meta_lr=0.05，
# 取更保守的 0.01→0.001 以降低元更新方差/不稳定；如需更快元适应可上调。
meta_lr_start: 0.01        # outer update 学习率：线性衰减起点
meta_lr_end: 0.001         # outer update 学习率：线性衰减终点
batch_size: 32
sequence_len: 32
burn_in_len: 8         # R2D2 式隐状态重建步数
gamma: 0.99            # 必须与 env reward 的 gamma 一致（PBRS 策略不变性前提）
n_step: 5
grad_clip: 10.0        # 梯度范数裁剪（inner loop SGD）

# DQfD 损失权重
# lambda_margin 需要远小于 1.0：随机初始化时 L_margin 约是 L_TD 的 100 倍，
# 等权重会让 Q 值被 margin 目标主导而非 TD，导致专家退火后崩溃。
# 推荐范围：0.1–0.5；配合 lambda_l2 加强来限制 Q 量级（见下方注释）。
lambda_td: 1.0
lambda_nstep: 1.0
lambda_margin: 0.5    # 从 1.0 降至 0.5；初始化时 L_margin/L_TD ≈ 100x，等权重会让 margin 主导
lambda_l2: 0.0001     # 从 1e-5 提至 1e-4（DQfD 原论文值），限制 Q 量级防止爆炸
margin: 0.5           # 间隔值 m；对 Q_max≈5~10 时意味着 5-10% 区分间隔，合理

# 数值安全
mellowmax_alpha: 1.0   # 先取 1.0，按 Q_max/Q_mean 在 {0.5,1,2} 中调

# 阶段二专家/自游走混合比例（课程式）
expert_ratio_start: 0.9
expert_ratio_end: 0.5
expert_ratio_decay_iters: 8000

# 地图采样概率（前期/中期/后期）
map_schedule:
  early:
    random: 0.45
    warehouse: 0.20
    maze: 0.20
    room: 0.15
  mid:
    random: 0.30
    warehouse: 0.30
    maze: 0.25
    room: 0.15
  late:
    random: 0.20
    warehouse: 0.30
    maze: 0.30
    room: 0.20

# 调试与性能诊断
debug: false             # true 时启用 Profiler，每 profile_interval 个 meta-iter 打印耗时报告
profile_interval: 200   # profiler 报告频率（debug=true 时生效）

# 并行（目标硬件 2×RTX 5090 + 47 核 CPU）
# 已实现并被代码读取：task_parallel_gpus、tasks_per_gpu。
# ⚠️ 其余键当前【未接线】（代码 0 引用）——env-worker 多进程采样(T5.2)、AMP、
#    torch.compile/CUDA graphs 尚未实现。设为 true 不会启用任何优化，性能预期
#    勿据此估算（见设计文档 §4.2/§4.3）。接线后再移除 [未实现] 标注。
parallel:
  task_parallel_gpus: [0, 1]   # [已实现] 双卡 task-并行 Reptile
  tasks_per_gpu: 2             # [已实现] 每卡串行 inner loop 数；总 task = len(gpus)*tasks_per_gpu
  num_env_workers: 40          # [未实现] CPU 多进程 env/观测构建（spawn，不碰 CUDA）
  num_lacam_workers: 4         # [未实现] C++ 绑定，按需生成/介入
  start_method: spawn          # [未实现]
  shared_buffer_dtype: uint8   # [未实现] patch 共享内存 zero-copy
  use_amp: false               # [未实现] AMP 混合精度（接线后改 true）
  use_torch_compile: false     # [未实现] torch.compile + CUDA graphs（接线后改 true）
