# 阶段二训练配置：DQfD + Reptile 元预训练
# 对应设计文档 §3.3–3.4

meta_iterations: 20000
inner_steps: 5
inner_lr: 0.0003
# outer update 学习率：线性衰减。0.05→0.005：高起点让前期靠外层快校准 Q（配合
# inner_lr=0.0003 的小心 inner 步），末段衰减降方差收尾。0.05 起点已在 data_test
# 验证 Q 不发散、单调爬升至 ~3.6（masked max bootstrap）；末段 0.005 比旧 0.001 高
# 以补偿 inner_lr=0.0003 偏小的有效步长。
meta_lr_start: 0.05        # outer update 学习率：线性衰减起点
meta_lr_end: 0.005         # outer update 学习率：线性衰减终点
batch_size: 32
sequence_len: 32
burn_in_len: 8         # R2D2 式隐状态重建步数
gamma: 0.99            # 必须与 env reward 的 gamma 一致（PBRS 策略不变性前提）
n_step: 5
grad_clip: 10.0        # 梯度范数裁剪（inner loop SGD）

# DQfD 损失权重
# lambda_margin 需要远小于 1.0：随机初始化时 L_margin 约是 L_TD 的 100 倍，
# 等权重会让 Q 值被 margin 目标主导而非 TD，导致专家退火后崩溃。
# 推荐范围：0.1–0.5；配合 lambda_l2 加强来限制 Q 量级（见下方注释）。
lambda_td: 1.0
lambda_nstep: 0.5     # 1.0→0.5：n-step 是最大/最噪的 TD 项，诊断中它主导真实 loss 并淹没模仿。
lambda_margin: 1.0    # 0.5→1.0：配合 td_losses 改 Huber（TD 梯度封顶），让模仿梯度能与 TD 竞争。
                      # 原注释"λ_margin 需远小于 1.0"是按初始化调的；训练中 TD 量级反转暴涨、
                      # margin 被淹没致 SR=0（maze/random 全 0、AR 随训练下降），见 memory phase2 诊断。
lambda_l2: 0.0001     # 从 1e-5 提至 1e-4（DQfD 原论文值），限制 Q 量级防止爆炸
margin: 0.5           # 间隔值 m，匹配 Q 尺度。最终设计：goal_reward=3.5/return~5 → Q~5，
                      # margin=0.5≈Q 的 10%，模仿信号够强且不扭曲 dueling V。
                      # （小 Q 区 margin 须更小否则迫使 V 负；现 Q~5 故可用 0.5）。

# reward 尺度：在 dqfd_sequence_loss 处对 reward 统一乘此系数。归一化(normalize_shaping)已让
# 跨族 return≈0.9 统一；reward_scale 单独定 Q 的绝对量级。Q≈0.9 时 margin(0.5) 占~98%(过小)、
# Q~15-30 时 TD 淹 margin；平衡点 Q~2-4（td/n 与 margin 同量级、mgn~30-45%，DQfD 论文占比）。
# 最终设计：reward 本身已放大（goal_reward=3.5/return~5/Q~5），故 reward_scale=1.0 不缩。
# 大 goal → 价值信号强、Q 校准得动；Q~5 → margin=0.5 既强又不扭曲 V；td/n 与 margin 同量级。
reward_scale: 1.0

# 数值安全
mellowmax_alpha: 1.0   # 设计默认。诊断结论：α=2 仅均匀缩 loss ~10%、不改动力学（td 同样上爬），
                       # α 不是 loss 攀升的杠杆，故还原 1.0。loss 高的真因是 n-step/1-step 目标
                       # 结构性分歧（n-step 主导真实 loss），见 memory phase2 诊断。

# 阶段二专家/自游走混合比例（课程式）
# self-play 已接线（selfplay.enable=true 时 sp_buf 被 producer 填充）→ 恢复课程式衰减：
# 早期专家为主（0.9），后期增自游走（0.5），让 OOD 脏状态的 Q 被 self-play TD 压回真值。
# 注意：consumer 端 total = er·L_expert + (1-er)·L_selfplay（_inner_step），且 selfplay 关 margin。
expert_ratio_start: 0.9
expert_ratio_end: 0.5
expert_ratio_decay_iters: 8000

# 自游走（阶段二 off-policy，填充 sp_buf；见 trainers/selfplay_producer.py）
selfplay:
  enable: true
  rollout_interval: 4        # 每隔 K 个 meta-iter 同步 θ_meta 后采一次（θ_meta 漂移极小→近当前策略）
  n_env_per_family: 2        # 每族并行 env 数（4 族 → 每次 rollout 产 4×n_env 段）
  num_agents: 96             # ★ 与专家数据对齐（专家 buffer 为 96 体）
  map_size: 64               # ★ 与专家数据对齐
  segment_len: 32            # = sequence_len，配合 burn_in_len=8 + n_step=5
  obs_radius: 5              # K=2r+1=11，与 patch 一致
  buffer_capacity_segments: 512   # sp_buf 容量（按段计；每段 ~十几 MB）
  families: [random, mazes, sc1, street, wc3]   # when-to-switch 原生 5 族（与专家数据对齐）
  env_config_tpl: "configs/env_{fam}.yaml"

# 地图采样概率（前期/中期/后期）
map_schedule:
  early:
    random: 0.45
    warehouse: 0.20
    maze: 0.20
    room: 0.15
  mid:
    random: 0.30
    warehouse: 0.30
    maze: 0.25
    room: 0.15
  late:
    random: 0.20
    warehouse: 0.30
    maze: 0.30
    room: 0.20

# 调试与性能诊断
debug: false             # true 时启用 Profiler，每 profile_interval 个 meta-iter 打印耗时报告
profile_interval: 200   # profiler 报告频率（debug=true 时生效）

# 并行（目标硬件 2×RTX 5090 + 47 核 CPU）
# [已实现]：task_parallel_gpus、tasks_per_gpu、use_amp、use_torch_compile。
# [未实现]：env-worker 多进程自游走采样子系统（T5.2，§4.5）——num_env_workers /
#          num_lacam_workers / start_method / shared_buffer_dtype。当前阶段二 selfplay
#          buffer 未填充，这些键暂不生效；接线后移除标注。
parallel:
  task_parallel_gpus: [0, 1]   # [已实现] 双卡 task-并行 Reptile
  tasks_per_gpu: 2             # [已实现] 每卡串行 inner loop 数；总 task = len(gpus)*tasks_per_gpu
  # 实测(B=32,N=96,RTX5090)：AMP 让纯前向+反向 573→513ms(~10%)+省激活显存 → 默认开。
  # torch.compile 只编 patch_encoder（仅占前向+反向 66/573≈11%），且 +~20s 启动 +
  # 与 Reptile 每轮 load_state_dict 的 CUDA-graph 脆弱性，端到端无可测收益 → 默认关。
  # 真正的瓶颈在 ① 逐 t 通信 Python 循环(顺序、launch 多) ② Reptile 每轮
  # load_state_dict/deepcopy/CPU 传输(~22%)；要提速应优先向量化通信循环（§4.3），非精度/编译。
  use_amp: true                # [已实现] AMP 混合精度（autocast+GradScaler；entmax/mellowmax 内部 fp32；CPU 自动停用）
  use_torch_compile: false     # [已实现，默认关] torch.compile patch_encoder（reduce-overhead→default→eager 回退）；编码瓶颈时再开
  num_env_workers: 40          # [未实现] CPU 多进程 env/观测构建（spawn，不碰 CUDA）
  num_lacam_workers: 4         # [未实现] C++ 绑定，按需生成/介入
  start_method: spawn          # [未实现]
  shared_buffer_dtype: uint8   # [未实现] patch 共享内存 zero-copy
