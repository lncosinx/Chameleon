# Pogema maze 地图配置（长通道、多转角，考验记忆与死锁恢复）
# 对齐 pogema-benchmark/raw_data_LMAPF/02-mazes/02-mazes.yaml
# 需经 pogema-toolbox MazeGenerator.generate_maze 生成
map_type: maze
map_size: 64           # 目标 64×64
num_agents: 8          # 开发默认；目标 96。⚠️ 四个地图族必须用相同 num_agents 生成
                       # （专家 buffer 要求 N 一致，add_episode 拒绝混入不同 N）；命令行 --num-agents 覆盖
obs_radius: 5
max_episode_steps: 512 # 设计文档 §0 目标值；maze 路径长，不能低于 256

# maze 结构参数（pogema-toolbox MazeGenerator，每 episode 随机采样）
# 障碍密度由 obstacle_density_min/max + wall_components 控制，不用顶层 obstacle_density
maze:
  width_min: 20
  width_max: 64
  height_min: 20
  height_max: 64
  obstacle_density_min: 0.2
  obstacle_density_max: 0.4
  wall_components_min: 1
  wall_components_max: 8

collision_system: soft
on_target: finish
# observation_type 不设（Pogema 2.x 默认返回 (3,K,K) 局部观测数组）

# 奖励参数（RewardBuilder.from_config 读取）
reward:
  lambda_f:       1.0
  shaping_clip:   5.0
  goal_reward:    1.0
  step_cost:      0.001
  collision_cost: 0.1
  gamma:          0.99
