# 大规模骨干臂（2026-09-20）：7.45M GRU → 7.57M Mamba，唯一变量 = 时间核。
# 依据：小规模 A/B 正式协议 12 档全胜、合计 +0.333（参数仅 +3%）。
# d_state=16 不可降：状态量 = d_inner × d_state 是 Mamba 记忆容量载体，而记忆正是收益来源。
# temporal_checkpoint=false：接入官方 CUDA 选择性扫描核后，峰值显存 29.7→19.6GiB、
#   速度 14.68→5.94 s/it，检查点已无必要且反而拖慢 47%。两条路径数值等价（1e-6），
#   见 scripts/test_mamba_kernel.py。
cnn_channels: 128
comm_dim: 192
comm_radius: 4
comm_rounds: 1
comm_topk_cap: 6
cost2go_clip: 10.0
d_conv: 4
d_model: 320
d_scalar: 32
d_state: 16
ema_decay: 0.0
entmax_alpha: 1.5
head_hidden: 256
intent_dim: 192
intent_mode: action
mamba_expand: 2
n_res_blocks: 3
num_actions: 5
num_attention_heads: 4
obs_radius: 5
patch_channels: 5
scalar_feat_dim: 8
spatial_pool: 0
stickiness_bonus: 0.1
tau_in: 0.05
tau_out: 0.02
temporal_backend: mamba
temporal_checkpoint: false
temporal_layers: 2
