# v3 网络配置 — 残差 CNN 空间编码 + 软稀疏/迟滞通信 + Mamba 时间核 + 动作 logits（离线 IL）
# 取代 network_biintent_drqn.yaml（CNN+GRU+Dueling Q）与 network_transformer.yaml（重 token transformer）。

obs_radius: 5
patch_channels: 4      # 原生 3 + 足迹 1（INVARIANT 5）
scalar_feat_dim: 8     # 目标方向(2)+上一步动作(5)+到达(1)（INVARIANT 6）
num_actions: 5         # wait/up/down/left/right（INVARIANT 1）

# --- 空间编码（轻量残差 CNN）---
d_model: 192
cnn_channels: 64
d_scalar: 32
n_res_blocks: 1        # 11×11 小 FOV，1 个残差块够（别过度堆深）

# --- 通信（INVARIANT 10，v3 头条贡献：软稀疏 entmax + 迟滞，保留）---
comm_rounds: 1         # 邻居消息传递轮数（多轮作消融轴）
intent_dim: 128
comm_dim: 128
comm_radius: 4         # r_c < obs_radius=5
comm_topk_cap: 6       # 算力上限（非邻居选择机制）
entmax_alpha: 1.5
tau_in: 0.05
tau_out: 0.02
stickiness_bonus: 0.1
ema_decay: 0.0
num_attention_heads: 4

# --- 时间核（治大图长程记忆）---
temporal_backend: mamba   # mamba（纯 torch SSM）| gru | lstm
temporal_layers: 2
d_state: 16               # SSM 状态维
d_conv: 4                 # 因果卷积核
mamba_expand: 2           # 内部扩张倍数

# --- 动作头 ---
head_hidden: 128
