# 判决臂（2026-09-24）：Mamba 的 +0.333 到底来自哪？
# 已排除：SSM 记忆（已定论 18：dt 初始化缺失 → scan 坍缩）、pre-norm 残差（gprenorm 臂 −0.060 n.s.）。
# 仅剩候选：**深度可分离因果卷积的 4 步局部时序混合**、门控 MLP 结构、宽度。
# 本臂唯一变量 = d_conv 4 → 1（kernel=1 使卷积退化为逐通道缩放，**时序混合被完全移除**，
# 参数量几乎不变）。若掉回裸 GRU 的 8.682 ⇒ 增益全部来自那 4 步卷积，与状态空间无关。
# 其余一切（d_model/d_state/expand/intent_mode/训练配方/数据/seed）与 network_small_mamba.yaml 相同。
# 骨干 A/B（2026-09-20）：与 capsmall（2.16M GRU，mix12/lr1e-4/seed42/从零训/8k）唯一变量 = 时间核。
# Mamba 为纯 PyTorch 选择性扫描（不依赖 mamba_ssm）。实测 4.43s/it（GRU 1.20），显存 15.6GiB。
# 先在小规模判定 SSM 骨干是否真优于 GRU，再决定是否投 7.45M 档（8k 需 30h / 14k 需 53h）。
cnn_channels: 64
comm_dim: 128
comm_radius: 4
comm_rounds: 1
comm_topk_cap: 6
cost2go_clip: 10.0
d_conv: 1
d_model: 192
d_scalar: 32
d_state: 16
ema_decay: 0.0
entmax_alpha: 1.5
head_hidden: 128
intent_dim: 128
intent_mode: action
mamba_expand: 2
n_res_blocks: 1
num_actions: 5
num_attention_heads: 4
obs_radius: 5
patch_channels: 5
scalar_feat_dim: 8
spatial_pool: 0
stickiness_bonus: 0.1
tau_in: 0.05
temporal_backend: mamba
temporal_checkpoint: false
temporal_layers: 2
