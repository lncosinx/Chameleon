d_conv: 4
d_model: 320
d_scalar: 32
d_state: 16
ema_decay: 0.0
entmax_alpha: 1.5
head_hidden: 256
intent_dim: 192
intent_mode: action
mamba_expand: 2
n_res_blocks: 3
num_actions: 5
num_attention_heads: 4
obs_radius: 5
patch_channels: 5
scalar_feat_dim: 8
spatial_pool: 0
stickiness_bonus: 0.1
tau_in: 0.05
temporal_backend: gru
temporal_layers: 2
