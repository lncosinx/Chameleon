# Pogema warehouse 地图配置（规则货架、窄通道、瓶颈）
# 对齐 pogema-benchmark/raw_data_LMAPF/03-warehouse/03-warehouse.yaml
# 需经 pogema-toolbox WarehouseConfig + generate_warehouse 生成
map_type: warehouse
# 直接用 when-to-switch 全部 231 张地图，全局 8:2 划 train/test（all=全池、不分类别）。
map_name: "all"
map_size: 64           # 仅作元数据/回退用；实际尺寸由 registry 地图串决定
num_agents: 8          # 开发默认；目标 96（见设计文档 §0）；命令行 --num-agents 覆盖
obs_radius: 5
max_episode_steps: 512 # 设计文档 §0 目标值

# warehouse 结构参数（pogema-toolbox WarehouseConfig 默认值）
# 障碍密度由货架布局决定，obstacle_density 字段不适用
warehouse:
  wall_width: 5
  wall_height: 2
  walls_in_row: 5
  walls_rows: 5
  bottom_gap: 5
  horizontal_gap: 1
  vertical_gap: 3

collision_system: soft
on_target: finish
# observation_type 不设（Pogema 2.x 默认返回 (3,K,K) 局部观测数组）

# 奖励参数（RewardBuilder.from_config 读取）
reward:
  lambda_f:       1.5
  shaping_clip:   5.0
  goal_reward:    3.5
  step_cost:      0.005
  collision_cost: 0.3
  normalize_shaping: true
  gamma:          0.99
  # 持续无进展（死锁）惩罚——见 env_random.yaml 注释。
  stuck_cost:     0.05
  stuck_patience: 5
