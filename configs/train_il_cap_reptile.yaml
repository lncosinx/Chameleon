# SQ2 的 7.45M Reptile 臂（2026-09-23）。唯一变量 = 外层是否 Reptile 平均。
# 对照臂已存在：capbig_iter_8000.pt（同配置 reptile:false，正式协议 9.073）。
# 之前 SQ2 只在 2.16M 时代模型上做过，规模与论文主模型（7.45M）不符——本臂补齐。
# inner_steps=5 / tasks_per_meta=2 / meta_lr 0.1→0.01 与对照完全一致。
batch_size: 32
d4_augment: false
debug: false
excluded_weight: 0.3
families:
- maze32
- maze32b
- maze48
- maze48b
- maze64
- maze64b
- random32
- random32b
- random48
- random48b
- random64
- random64b
grad_clip: 10.0
held_out_family: null
il_wait_weight: 1.0
inner_lr: 0.0001
inner_steps: 5
label_smoothing: 0.0
meta_iterations: 30000
meta_lr_end: 0.01
meta_lr_start: 0.1
profile_interval: 200
reptile: true
sequence_len: 32
tasks_per_meta: 2
use_amp: true
